<footer class="footer app {{ site.themeClass }}">
  <div class="container">
    <div class="footgrid">
      <div>
        <div class="brand" style="cursor:default">
          <div class="logo">MO</div>
          <div>
            <div class="brandname">Michael Oguidan</div>
            <div class="brandsub mono">software engineer</div>
          </div>
        </div>
        <p class="footblurb">From code to the cloud — thoughts and experiences on software engineering, data, and innovation.</p>
      </div>
      <div>
        <div class="footh">Navigation</div>
        {% for item in site.navigation %}
          <a class="footlink" href="{{ item.url | relative_url }}">
            {{ item.title }}
          </a>
          {% endfor %}
      </div>
      <div>
        <div class="footh">Social Networks</div><a class="footlink"
          href="https://www.linkedin.com/in/michael-oguidan-b642361a6/" target="_blank">LinkedIn ↗</a><a
          class="footlink" href="https://github.com/Oguidan" target="_blank">GitHub ↗</a>
      </div>
    </div>
  </div>
</footer>
