<header class="site-header" role="banner">
  <div class="app {{ site.themeClass }}" data-screen-label="Blog Michael Oguidan">

    {%- assign default_paths = site.pages | map: "path" -%}
    {%- assign page_paths = site.header_pages | default: default_paths -%}

    <nav class="nav">
      <div class="container navwrap">
        <a rel="author" href="{{ " /" | relative_url }}">{{ site.title | escape }}
          <div class="brand">
            <div class="logo">MO</div>
            <div>
              <div class="brandname">Michael Oguidan</div>
              <div class="brandsub mono">software engineer</div>
            </div>
          </div>
        </a>
        <div class="navlinks">
          <a class="navlink {{ homeActive }}" onClick="{{ goHome }}">Accueil</a>
          <a class="navlink {{ articlesActive }}" onClick="{{ goArticles }}">Articles</a>
          <a class="navlink {{ aboutActive }}" onClick="{{ goAbout }}">À propos</a>
          <a class="navlink {{ styleActive }}" onClick="{{ goStyle }}">Style</a>
        </div>
        <div class="navact">
          <button class="iconbtn" onClick="{{ toggleTheme }}" title="{{ themeTitle }}">{{ themeIcon }}</button>
          <a class="iconbtn" href="https://github.com/Oguidan" target="_blank" title="GitHub"><svg width="17"
              height="17" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z" />
            </svg></a>
          <a class="btn btn-primary btn-sm" onClick="{{ goContact }}">Me contacter</a>
        </div>
      </div>
    </nav>
  </div>
</header>
